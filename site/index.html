      <div class="hero-actions">

        <a class="btn" href="https://github.com/ArsalanRC/fanout" target="_blank" rel="noopener" data-i18n="hero.code">Read the code</a>
      </div>
    </div>

    <!--
      The signature. Four supplier lanes racing under one budget, on loop and
      on the real recorded timings. It is the product surface rather than an
      illustration of one, which is the thing the reference does.
    -->
    <div class="hero-stage" aria-hidden="true">
      <div class="stage-glass">
        <div class="stage-top">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="stage-url">GET /search?origin=CGN&amp;destination=STN</span>
        </div>
        <div class="hero-lanes" id="hero-lanes"></div>
        <div class="hero-foot"><span id="hero-count">0/4</span><span id="hero-clock">0 ms</span></div>
      </div>
    </div>
  </section>

  <hr class="rule">

  <!-- ============================================================== search -->
  <section id="search" class="search">
    <p class="label" data-i18n="search.label">Search</p>
    <h2 data-i18n="search.title">Find a flight</h2>

    <form class="finder" id="finder" autocomplete="off">
      <label class="field">
        <span data-i18n="search.from">From</span>
        <select id="route">
          <option value="CGN-STN">Cologne Bonn (CGN)</option>
          <option value="FRA-LHR">Frankfurt (FRA)</option>
        </select>
      </label>
      <label class="field">
        <span data-i18n="search.to">To</span>
        <output id="to">London Stansted (STN)</output>
      </label>
      <label class="field">
        <span data-i18n="search.when">Departing</span>
        <output>Tue 1 Sep 2026</output>
      </label>
      <label class="field">
        <span data-i18n="search.who">Travelling with</span>
        <select id="basket">
          <option value="cabin" data-i18n="search.cabin">Hand luggage</option>
          <option value="checked" data-i18n="search.checked">Hand luggage and a suitcase</option>
        </select>
      </label>
      <label class="field narrow">
        <span data-i18n="search.budget">Answer within</span>
        <select id="budget">
          <option value="3000">3000 ms</option>
          <option value="300">300 ms</option>
        </select>
      </label>
      <button type="submit" class="btn btn-primary" data-i18n="search.go">Search</button>
    </form>

    <div class="lanes" id="lanes"></div>
    <p class="axis"><span data-i18n="axis.zero">Asked</span><span id="budget-mark">3000 ms</span></p>

    <div class="sorts" id="sorts" role="tablist">
      <button type="button" data-sort="best" class="on" data-i18n="sort.best">Best</button>
      <button type="button" data-sort="cheap" data-i18n="sort.cheap">Cheapest</button>
      <button type="button" data-sort="fast" data-i18n="sort.fast">Fastest</button>
      <button type="button" data-sort="early" data-i18n="sort.early">Earliest</button>
      <span class="sort-hint" id="sort-hint"></span>
    </div>

    <div id="results" class="results"></div>
    <p class="note" id="completeness"></p>
    <div class="readout" id="readout"></div>
  </section>
