<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 64" width="264" height="64" role="img" aria-label="Halcyon">
  <title>Halcyon</title>
  <rect width="64" height="64" rx="14" fill="#0C3A31"/>
  <g fill="#D8C08A">
    <rect x="17" y="17" width="7.5" height="30" rx="3.75"/>
    <rect x="39.5" y="17" width="7.5" height="30" rx="3.75"/>
    <!--
      A gentle rise, five pixels over fifteen. The first version climbed nine
      and stopped reading as an H at all: a steep crossbar meeting the right
      stem high turns the whole monogram into a Cyrillic И.
    -->
    <path d="M24.5 32 L39.5 27 L39.5 34.5 L24.5 39.5 Z"/>
  </g>
  <!-- Light and very wide. The top of the market never raises its voice. -->
  <text x="82" y="41" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="23" font-weight="300" letter-spacing="6"
        fill="#0C3A31">HALCYON</text>
</svg>
