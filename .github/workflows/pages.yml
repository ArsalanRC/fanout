# Publishes site/ to GitHub Pages.
#
# Nothing is compiled here, and that is deliberate: the page is plain HTML, CSS
# and one script, so there is no toolchain to install and nothing that can break
# between a green build and a broken page.
#
# What it serves is not compiled either, but it is generated. site/data holds
# four searches recorded by PageData across both services, and PageDataTest
# fails in the build workflow when they stop matching what the code produces.
# So the page cannot drift, and the guard lives where a red build gets noticed.
#
# One manual step per repo, once: Settings, Pages, Source, GitHub Actions.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
